[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-financial-advisor"
version = "0.1.0"
description = "مشاور مالی محلی با شواهد و تأیید انسانی"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "jdatetime>=5,<6", "filelock>=3.16,<4", "numpy>=2,<3", "pandas>=2.2,<4", "statsmodels>=0.14,<0.15", "openpyxl>=3.1,<4", "pdfplumber>=0.11,<1", "pillow>=11,<13", "pyxirr>=0.10,<1", "marimo>=0.19,<1", "plotly>=6,<7"]

[project.optional-dependencies]
backend = ["psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1"]
ocr = ["pytesseract>=0.3.13,<1"]
easyocr = ["easyocr>=1.7,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
advisor = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.dashboard" = ["assets/*"]
"src.backend" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: موتور واقعی و فایل‌های مرجع محلی"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
