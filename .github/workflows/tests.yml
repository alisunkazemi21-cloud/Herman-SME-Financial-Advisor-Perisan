name: checkpoints
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-test-only
          POSTGRES_DB: herman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERMAN_TEST_ADMIN_DSN: postgresql://postgres:ci-local-test-only@127.0.0.1:5432/herman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ocr,backend]'
      - run: python -m pytest tests -q --tb=short
      - run: ruff check src tests
      - run: marimo check src/dashboard/notebook.py
